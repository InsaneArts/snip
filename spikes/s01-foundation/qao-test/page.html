<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SNIP-TEST</title>
<style>
  html, body { margin: 0; height: 100%; background: #101418; color: #e8e8e8; font: 20px system-ui, sans-serif; }
  #zone { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; outline: none; }
  #log { white-space: pre-wrap; font: 14px monospace; max-width: 90vw; }
</style>
</head>
<body>
<div id="zone" contenteditable="true" autofocus>
  <div><h1 id="title">SNIP-TEST</h1><div id="log">drop or paste here</div></div>
</div>
<script>
const target = new URLSearchParams(location.search).get('t') || 'unknown';
document.title = 'SNIP-TEST ' + target;
document.getElementById('title').textContent = 'SNIP-TEST ' + target;
const log = document.getElementById('log');

async function report(kind, dt) {
  const out = { target, kind, types: Array.from(dt.types || []), files: [], items: [] };
  for (const it of dt.items || []) out.items.push({ kind: it.kind, type: it.type });
  for (const f of dt.files || []) out.files.push({ name: f.name, type: f.type, size: f.size });
  try { if (out.types.includes('text/uri-list')) out.uri = dt.getData('text/uri-list'); } catch (e) {}
  try { if (out.types.includes('text/plain')) out.text = dt.getData('text/plain').slice(0, 200); } catch (e) {}
  const f = (dt.files || [])[0];
  if (f && f.type.startsWith('image/')) {
    try { const b = await createImageBitmap(f); out.w = b.width; out.h = b.height; } catch (e) { out.decode_error = String(e); }
  }
  log.textContent = JSON.stringify(out, null, 1);
  fetch('/result', { method: 'POST', body: JSON.stringify(out) });
}
addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
addEventListener('drop', e => { e.preventDefault(); report('drop', e.dataTransfer); });
addEventListener('paste', e => { e.preventDefault(); report('paste', e.clipboardData); });
document.getElementById('zone').focus();
fetch('/result', { method: 'POST', body: JSON.stringify({ target, kind: 'loaded' }) });
</script>
</body>
</html>
