<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SNIP-SCROLL</title>
<style>
  html, body { margin: 0; background: #f4f4f2; font: 15px system-ui, sans-serif; color: #222; }
  header { position: sticky; top: 0; height: 70px; background: #2d0a4e; color: #fff; display: flex; align-items: center; padding-left: 24px; font-size: 22px; z-index: 2; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; height: 48px; background: #0a4e2d; color: #fff; display: flex; align-items: center; padding-left: 24px; z-index: 2; }
  .row { height: 36px; display: flex; align-items: center; border-bottom: 1px solid #ddd; }
  .bits { display: flex; margin-left: 20px; }
  .bits i { width: 24px; height: 28px; display: block; }
  .on { background: #000; } .off { background: #fff; outline: 1px solid #eee; outline-offset: -1px; }
  .label { margin-left: 18px; width: 90px; }
  .bar { height: 10px; background: #e06a2a; border-radius: 5px; }
  .spacer { height: 60px; }
</style>
</head>
<body>
<header>SNIP scroll-capture test · sticky header</header>
<main id="rows"></main>
<div class="spacer"></div>
<footer>fixed footer · must appear exactly once</footer>
<script>
// Each row carries its index as a 12-bit black/white barcode (+1 parity bit),
// so a stitched image can be checked for duplicated or missing rows.
const N = 400, rows = document.getElementById('rows');
for (let i = 0; i < N; i++) {
  const r = document.createElement('div'); r.className = 'row';
  const bits = document.createElement('div'); bits.className = 'bits';
  let parity = 0;
  for (let b = 11; b >= 0; b--) { const on = (i >> b) & 1; parity ^= on; const e = document.createElement('i'); e.className = on ? 'on' : 'off'; bits.appendChild(e); }
  const p = document.createElement('i'); p.className = parity ? 'on' : 'off'; bits.appendChild(p);
  r.appendChild(bits);
  const l = document.createElement('div'); l.className = 'label'; l.textContent = 'Row ' + i; r.appendChild(l);
  const bar = document.createElement('div'); bar.className = 'bar'; bar.style.width = (40 + (i * 37) % 400) + 'px'; r.appendChild(bar);
  rows.appendChild(r);
}
</script>
</body>
</html>
