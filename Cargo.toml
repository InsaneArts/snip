[workspace]
resolver = "2"
# The M0 spike keeps its own lockfile and build.
exclude = ["spikes"]
members = ["crates/snip-core", "crates/snip-wayland", "crates/snip-hypr", "crates/snip-ipc", "crates/snip-cli", "crates/snip-bridge"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/tornikegomareli/snip"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.22", features = ["serde"] }
rusqlite = "0.32"
png = "0.18"
jpeg-encoder = "0.7"
rqrr = "0.11"
rxing = { version = "0.9", default-features = false, features = ["decoders", "multi_barcode_readers", "aztec", "datamatrix", "pdf417", "oned", "encoding_rs"] }
qrcode = { version = "0.14", default-features = false }
image-webp = "0.2"
zip = { version = "2", default-features = false }
rustix = { version = "1", features = ["fs", "mm", "time", "pipe", "net", "process"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ulid = "1"
calloop = "0.14"
calloop-wayland-source = "0.4"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-hyprland = { version = "1.2", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[profile.release]
debug = 1
